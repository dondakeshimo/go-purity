version: "2"

run:
  timeout: 5m
  # Test files are excluded from linting; they are still covered by gofmt,
  # go vet, and go test in CI.
  tests: false

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - exhaustive
    - exhaustruct_v5
    - gocheckcompilerdirectives
    - gocritic
    - makezero
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - unconvert
    - usestdlibvars
    - wastedassign
    - whitespace
  settings:
    exhaustive:
      # token.Token is not an enum of this project; our switches only care
      # about a couple of tokens and handle the rest via a default case.
      ignore-types:
        - '^go/token\.Token$'
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives

formatters:
  enable:
    - gofmt
    - goimports
