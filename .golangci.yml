version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - gocheckcompilerdirectives
    - gocritic
    - makezero
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - unconvert
    - usestdlibvars
    - wastedassign
    - whitespace
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
